<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Martha Llano</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #555555;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       CABECERA
       ========================= */

    .martha-header {
      width: 100%;
      background: #ffffff;
      text-align: center;
      padding: 25px 30px 0;
    }


    /* =========================
       LOGO
       ========================= */

    .martha-logo {
      width: 300px;
      max-width: 55vw;
      margin: 0 auto 12px;
    }

    .martha-logo img {
      width: 100%;
      height: auto;
      display: block;
    }


    /* =========================
       NOMBRE
       ========================= */

    .martha-name {
      color: #315f3f;
      font-size: 34px;
      font-weight: 400;
      letter-spacing: 1px;
      line-height: 1.2;
      margin: 8px 0 25px;
    }


    /* =========================
       MENÚ
       ========================= */

    .martha-menu {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 13px;

      padding: 0 0 25px;

      border-bottom: 1px solid #dddddd;
    }


    /* =========================
       BOTONES / ENLACES
       ========================= */

    .martha-menu a {
      color: #555555;
      text-decoration: none;
      font-size: 17px;
      font-weight: 400;
      white-space: nowrap;

      transition: color 0.2s ease;
    }

    .martha-menu a:hover {
      color: #315f3f;
    }


    /* =========================
       SEPARADORES
       ========================= */

    .menu-separator {
      color: #c9c9c9;
      font-size: 7px;
      line-height: 1;
    }


    /* =========================
       INSTAGRAM
       ========================= */

    .instagram {
      font-size: 23px !important;
      line-height: 1;
      margin-left: 3px;
    }


    /* =========================
       TABLET
       ========================= */

    @media (max-width: 1000px) {

      .martha-logo {
        width: 260px;
      }

      .martha-name {
        font-size: 30px;
      }

      .martha-menu {
        gap: 10px;
      }

      .martha-menu a {
        font-size: 15px;
      }
    }


    /* =========================
       CELULAR
       ========================= */

    @media (max-width: 600px) {

      .martha-header {
        padding: 18px 15px 0;
      }

      .martha-logo {
        width: 210px;
        max-width: 70vw;
      }

      .martha-name {
        font-size: 25px;
        margin-top: 5px;
        margin-bottom: 18px;
      }

      .martha-menu {
        gap: 8px;
        padding-bottom: 18px;
      }

      .martha-menu a {
        font-size: 14px;
      }

      .menu-separator {
        font-size: 5px;
      }
    }

  </style>
</head>


<body>

  <!-- =========================
       CABECERA MARTHA LLANO
       ========================= -->

  <header class="martha-header">

    <!-- LOGO ORIGINAL -->
    <div class="martha-logo">
      <img
        src="https://github.com/marthaelenallano/marthallano.com/blob/main/imagenes/LogoMartha.jpg?raw=true"
        alt="Martha Llano">
    </div>


    <!-- NOMBRE -->
    <div class="martha-name">
      MARTHA LLANO
    </div>


    <!-- MENÚ ACTUAL -->
    <nav class="martha-menu">

      <a href="#lo-que-siento">
        Lo que siento
      </a>

      <span class="menu-separator">◆</span>


      <a href="#entre-dos-mundos">
        Entre dos mundos
      </a>

      <span class="menu-separator">◆</span>


      <a href="#gestionando-mis-emociones">
        Gestionando mis emociones
      </a>

      <span class="menu-separator">◆</span>


      <a href="#disenar-para-interpretar">
        Diseñar para interpretar
      </a>

      <span class="menu-separator">◆</span>


      <a href="#captando-la-luz">
        Captando la luz que veo
      </a>

      <span class="menu-separator">◆</span>


      <a href="#contacto">
        Contacto
      </a>


      <a
        class="instagram"
        href="https://www.instagram.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram">
        ◎
      </a>

    </nav>

  </header>

</body>
</html>
