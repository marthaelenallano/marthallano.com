<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Martha Llano</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    :root{
      --verde-oscuro: #2f5d3a;
      --verde: #2f8f46;
      --blanco: #ffffff;
      --negro: #101010;
      --gris-oscuro: #454545;
      --gris-medio: #777;
      --gris-suave: #bdbdbd;
      --fondo: #fafafa;
      --fondo-panel: #f4f4f2;
      --texto: #4a4a4a;
    }

    /* Reset / base */
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; padding: 0;
      font-family: "DM Sans", sans-serif;
      line-height: 1.7;
      background: var(--fondo);
      color: var(--texto);
    }
    img { display: block; max-width: 100%; }
    a { text-decoration: none; color: inherit; }

    /* layout */
    .contenedor { width:100%; max-width:none; margin:0; padding:0; }

    /* Header/topbar */
    .topbar {
      width: 100%;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      padding: 8px 2.5vw 0;
      gap: 12px;
      flex-wrap: nowrap;
    }

    .identidad{
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      justify-content:flex-end;
      gap:4px;
      flex: 0 0 auto;
      margin-right: 10px;
    }

    /* Two logo images (white + color). We'll show/hide by body class */
    .logo-martha{
      width: 150px;
      height: auto;
      object-fit: contain;
      object-position: left bottom;
      display:block;
    }
    .logo-martha.logo-white{ display:none; }   /* hidden by default */
    .logo-martha.logo-color{ display:block; }

    .nombre{
      font-weight:600;
      font-size: clamp(1.02rem, 1.15vw, 1.18rem);
      line-height:1.08;
      letter-spacing: 0;
      white-space: nowrap;
      margin:0;
      padding:0;
    }

    .navegacion{
      display:flex;
      align-items:flex-end;
      justify-content:flex-end;
      gap: clamp(6px, 0.65vw, 12px);
      white-space: nowrap;
      flex: 1 1 auto;
      font-weight:600;
      font-size: clamp(.66rem, .7vw, .82rem);
      line-height:1.1;
    }
    .navegacion a{
      display:inline-flex;
      align-items:center;
      padding:4px 6px;
      border-radius:4px;
      transition: color .18s ease, background-color .18s ease;
    }
    .separador{ font-size:.36rem; color: inherit; margin:0 4px; }

    .social{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:16px;
      height:16px;
      margin-left:4px;
      color: inherit;
    }
    .social svg{ width:16px; height:16px; display:block; }

    /* Home and internal share same sizes & positions; only colors differ */
    /* ----------------- HOME ----------------- */
    body.home .topbar,
    .home .topbar { color: var(--blanco); }
    body.home .logo-martha.logo-white { display:block; }   /* show white logo */
    body.home .logo-martha.logo-color { display:none; }    /* hide color logo */
    body.home .nombre,
    body.home .navegacion,
    body.home .navegacion a,
    body.home .social,
    body.home .separador {
      color: var(--blanco);
    }
    /* Hover on home -> verde oscuro */
    body.home .navegacion a:hover,
    body.home .navegacion a:focus-visible,
    body.home .social:hover,
    body.home .social:focus-visible {
      color: var(--verde-oscuro) !important;
      background: transparent !important;
      outline: none;
    }

    /* ----------------- INTERNAL / INTERIOR ----------------- */
    /* Use class "internal" on body for interior pages. */
    body.internal .logo-martha.logo-color { display:block; }
    body.internal .logo-martha.logo-white { display:none; }

    body.internal .nombre,
    body.internal .navegacion,
    body.internal .navegacion a,
    body.internal .social,
    body.internal .separador {
      color: var(--negro);
    }
    body.internal .navegacion a:hover,
    body.internal .navegacion a:focus-visible,
    body.internal .social:hover,
    body.internal .social:focus-visible {
      color: var(--verde-oscuro) !important;
      background: transparent !important;
      outline: none;
    }

    /* If neither class is present, default to internal behavior (safe fallback) */
    body:not(.home) .logo-martha.logo-color { display:block; }
    body:not(.home) .logo-martha.logo-white { display:none; }
    body:not(.home) .navegacion a:hover,
    body:not(.home) .social:hover { color: var(--verde-oscuro) !important; }

    /* Responsive tweaks to keep alignment */
    @media (max-width:1100px){
      .logo-martha{ width: 110px; }
      .identidad{ flex:0 0 145px; width:145px; min-width:145px; align-items:center; }
      .navegacion{ justify-content:center; flex-wrap:wrap; gap:8px 12px; font-size:.78rem; }
      .topbar{ align-items:center; padding:12px 4vw 0; }
    }

    @media (max-width:700px){
      .logo-martha{ width: 82px; }
      .nombre{ text-align:center; font-size:1rem; }
      .navegacion{ width:100%; justify-content:center; font-size:.82rem; gap:8px 10px; }
      .topbar{ flex-direction:column; align-items:center; gap:12px; padding:16px 3vw 0; }
    }
  </style>
</head>

<!--
  Para HOME: deja body class="home"
  Para páginas interiores: usa body class="internal" (o quita "home")
-->
<body class="home">
  <div class="contenedor">
    <header class="topbar" role="banner" aria-label="Encabezado principal">
      <a class="identidad" href="/" aria-label="Martha Llano - Inicio">
        <!-- two images: white & color. Same CSS class/size; hide/show depending on body class -->
        <img class="logo-martha logo-color" src="imagenes/LogoMartha.png" alt="Logo Martha Llano - color">
        <img class="logo-martha logo-white" src="imagenes/LogoMarthaWhite.png" alt="Logo Martha Llano - blanco">
        <span class="nombre">MARTHA LLANO</span>
      </a>

      <nav class="navegacion" role="navigation" aria-label="Menú principal">
        <a href="#lo-que-siento">LO QUE SIENTO</a>

        <span class="separador">·</span>

        <!-- socials -->
        <a class="social" href="#" aria-label="Instagram">

        <a class="social" href="#" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.94 8.5A1.56 1.56 0 1 1 6.94 5.4a1.56 1.56 0 0 1 0 3.1ZM5.5 9.7h2.9v9.8H5.5zm5.2 0h2.78v1.33h.04c.39-.73 1.33-1.5 2.75-1.5 2.93 0 3.47 1.93 3.47 4.43v5.54h-2.9v-5.2c0-1.24-.02-2.84-1.73-2.84-1.73 0-2 1.35-2 2.73v5.31h-2.9z"/></svg>
        </a>
      </nav>
    </header>
  </div>

  <!-- Example content so you can test interior behavior: -->
  <main>
    <section id="lo-que-siento" style="padding:120px 4vw 40px;">
      <h1 style="color:var(--verde-oscuro); margin:0 0 24px;">LO QUE SIENTO</h1>
      <p style="max-width:900px;">Texto de ejemplo para probar la apariencia del header sobre la portada y en página interior.</p>
    </section>
  </main>
</body>
</html>
